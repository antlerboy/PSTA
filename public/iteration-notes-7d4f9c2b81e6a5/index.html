<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSTA iteration notes</title><style>body{font:16px Arial,sans-serif;max-width:800px;margin:40px auto;padding:0 20px}textarea,input,select{width:100%;box-sizing:border-box;margin:.4rem 0 1rem;padding:.7rem}button{padding:.7rem 1rem;margin-right:.5rem}.note{border-top:1px solid #ccc;padding:1rem 0}</style></head><body><h1>PSTA iteration notes</h1><p>Private working notebook on this browser. This URL is unlisted, not authenticated.</p><label>Page<input id="page"></label><label>Priority<select id="priority"><option>Normal</option><option>High</option><option>Low</option></select></label><label>Note<textarea id="note" rows="6"></textarea></label><button id="add">Add note</button><button id="copy">Copy open notes</button><button id="export">Export JSON</button><div id="notes"></div><script>const key='pstaIterationNotes';let data=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(data));render()}function render(){notes.innerHTML=data.map((n,i)=>`<div class="note"><b>${n.priority}</b> — ${n.page||'General'}<br>${n.text.replace(/</g,'&lt;')}<br><small>${n.date}</small><br><button onclick="data.splice(${i},1);save()">Delete</button></div>`).join('')}add.onclick=()=>{if(!note.value.trim())return;data.unshift({page:page.value.trim(),priority:priority.value,text:note.value.trim(),date:new Date().toISOString()});note.value='';save()};copy.onclick=async()=>{await navigator.clipboard.writeText(data.map(n=>`- [${n.priority}] ${n.page||'General'}: ${n.text}`).join('\n'));};export.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='psta-iteration-notes.json';a.click()};render()</script></body></html>
