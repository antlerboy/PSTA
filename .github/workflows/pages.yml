name: Publish PSTA website

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "editorial/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble the complete PSTA site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir deploy
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import io
          import re
          import tarfile
          import zipfile
          from pathlib import Path

          parts = sorted(Path('site-full-text').glob('part-*'))
          if not parts:
              raise SystemExit('No complete-site bundle parts were found')
          text = ''.join(path.read_text(encoding='utf-8', errors='ignore').strip() for path in parts)
          candidates = []
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', text)
          clean += '=' * (-len(clean) % 4)
          try:
              candidates.append(('base64', base64.b64decode(clean, validate=False)))
          except Exception:
              pass
          candidates.append(('raw', text.encode('utf-8')))

          extracted = False
          errors = []
          for label, data in candidates:
              try:
                  with tarfile.open(fileobj=io.BytesIO(data), mode='r:*') as archive:
                      root = Path('deploy').resolve()
                      for member in archive.getmembers():
                          destination = (root / member.name).resolve()
                          if root != destination and root not in destination.parents:
                              raise RuntimeError(f'Unsafe archive member: {member.name}')
                      archive.extractall(root)
                  print(f'Extracted the full site as a tar archive from {label} data')
                  extracted = True
                  break
              except Exception as exc:
                  errors.append(f'{label}/tar: {exc}')
              try:
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      root = Path('deploy').resolve()
                      for name in archive.namelist():
                          destination = (root / name).resolve()
                          if root != destination and root not in destination.parents:
                              raise RuntimeError(f'Unsafe archive member: {name}')
                      archive.extractall(root)
                  print(f'Extracted the full site as a zip archive from {label} data')
                  extracted = True
                  break
              except Exception as exc:
                  errors.append(f'{label}/zip: {exc}')
          if not extracted:
              raise SystemExit('Could not reconstruct the complete site bundle:\n' + '\n'.join(errors))
          PY

          if [ -d overrides ]; then
            cp -a overrides/. deploy/
          fi

          python3 scripts/apply_public_copy_offline.py deploy
          python3 scripts/build_news.py deploy

          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('assets/nesta-logo.b64')
          text = re.sub(r'\s+', '', path.read_text(encoding='ascii'))
          text += '=' * (-len(text) % 4)
          path.write_text(text, encoding='ascii')
          print('Nesta base64 characters:', len(text))
          PY

          python3 scripts/final_public_fix_offline.py deploy
          python3 scripts/add_latest_panel.py deploy
          python3 scripts/add_easter_eggs.py deploy

          test -f deploy/index.html
          test -f deploy/404.html
          test -f deploy/assets/css/site.css
          test -f deploy/assets/css/latest-panel.css
          test -f deploy/assets/css/easter-eggs.css
          test -f deploy/assets/js/easter-eggs.js
          test -f deploy/programmes/index.html
          test -f deploy/partners/index.html
          test -f deploy/news/index.html
          test -f deploy/news/feed.xml
          test -s deploy/assets/img/psta-logo-official.svg
          test -s deploy/assets/img/psta-logo-white.png
          grep -qi "public service" deploy/assets/img/psta-logo-official.svg
          test "$(find deploy -name index.html | wc -l)" -ge 30
          grep -qi "2,500+" deploy/index.html
          grep -q "News, social media, and useful things" deploy/index.html
          grep -q "Latest from the PSTA" deploy/index.html
          test "$(grep -c '<section class="section psta-latest-panel"' deploy/index.html)" -eq 1
          ! grep -q "PSTA_NEWS_START" deploy/index.html
          ! grep -q "PSTA_NCA_2026" deploy/index.html
          ! grep -q "Discuss a place with David Mason" deploy/index.html
          grep -q "PSTA_NCA_2026" deploy/programmes/national-commissioning-academy/index.html
          grep -q "Try the Commissioning Compass" deploy/index.html
          grep -Rqi "2,490" deploy
          grep -Rqi "Registered Social Enterprise" deploy
          grep -qi "Formal partners" deploy/partners/index.html
          grep -qi "E3M" deploy/partners/index.html
          grep -qi "Nesta" deploy/partners/index.html
          grep -qi "The Social Innovation Partnership" deploy/partners/index.html
          grep -qi "LocalGov Digital" deploy/partners/index.html
          grep -qi "Browne Jacobson" deploy/partners/index.html
          grep -q "You appear to be at the learning edge." deploy/404.html
          grep -q "Return to what I thought I knew" deploy/404.html
          grep -q "Show me something unexpected" deploy/404.html
          grep -q "Going round in circles is diagnostic information." deploy/assets/js/easter-eggs.js
          grep -q "Commissioning Compass question" deploy/assets/js/easter-eggs.js
          grep -q '.announcement{background:var(--psta-dark)!important}' deploy/assets/css/site.css
          grep -q '.cta-panel{background:var(--cyan-wash)!important' deploy/assets/css/site.css
          grep -q 'assets/css/site.css?v=20260830-4' deploy/index.html
          grep -q 'assets/img/psta-logo-white.png' deploy/index.html
          ! grep -qiE "APACE|Fractal Consulting|Alliance for Useful Evidence|wider partner history" deploy/partners/index.html
          test ! -d deploy/partners/apace
          test ! -d deploy/partners/fractal-consulting
          ! grep -Rqi "Lead partner RedQuadrant" deploy
          ! grep -Rqi "twitter-white.png" deploy

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
