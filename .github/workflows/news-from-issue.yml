name: Publish PSTA news from an issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[Publish news]')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the submitter has repository write access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "${{ github.actor }} does not have permission to publish website news"; exit 1 ;;
          esac

      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create the news source file
        run: python3 scripts/news_from_issue.py "$GITHUB_EVENT_PATH"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "PSTA news publisher"
          git config user.email "actions@users.noreply.github.com"
          git add content/news
          git commit -m "Publish news from issue #${{ github.event.issue.number }}"
          git push origin main

      - name: Comment with the publishing result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=$(cat /tmp/psta-news-path.txt)
          slug=$(basename "$file" .md | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
          gh issue comment "${{ github.event.issue.number }}" --body "Published to the website build. The public page will be https://antlerboy.github.io/PSTA/news/$slug/ after the Pages workflow completes. The item has also been added to the RSS, social, and newsletter queues."
          gh issue close "${{ github.event.issue.number }}" --reason completed
