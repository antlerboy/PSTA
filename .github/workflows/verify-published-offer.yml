name: Verify published PSTA learning offer

on:
  workflow_run:
    workflows: ["Publish PSTA website"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check live learning offer and programme entry points
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import time
          import urllib.request
          checks = {
              '/': ['Bring a team and a real change', '/learning-and-capability/', 'January 2027'],
              '/learning-and-capability/': ['Learning and capability partner', 'twelve-week', 'mailto:david.mason@publicservicetransformation.org', 'redquadrant.com/service-change/'],
              '/programmes/': ['Develop a team through live service change', '/learning-and-capability/', 'January 2027'],
              '/programmes/national-commissioning-academy/': ['January 2027', 'Exact dates and the full timetable are to be confirmed.', 'Bring a team and a live commissioning challenge', '/learning-and-capability/'],
              '/news/outcomes-commissioning-islington-webinar/': ['Wednesday 4 November 2026, 13:30-14:30 GMT', 'January 2027', 'https://us06web.zoom.us/meeting/register/K8AM-rMiSHGRfmltxyYN_w'],
              '/news/national-commissioning-academy-september-2026/': ['Updated 21 October 2026', 'January 2027', 'timetable has now been superseded'],
              '/programmes/contract-management-development/': ['Open to applications', 'Wednesday 11 November 2026', '£1,350 plus VAT', '£8,950 excluding VAT', 'tel:+447701049836'],
              '/news/beyond-giving-receiving-social-care/': ['Care City', 'Connect'],
              '/news/common-ground-institute-founding-essay/': ['Social Investment Business', 'Common Ground Institute'],
              '/news/': ['January 2027', 'Beyond giving and receiving', 'Common Ground Institute'],
              '/news/feed.xml': ['January 2027'],
              '/sitemap.xml': ['/learning-and-capability/']
          }
          failures = []
          for path, required in checks.items():
              url = 'https://www.publicservicetransformation.org' + path
              for attempt in range(6):
                  try:
                      request = urllib.request.Request(url + '?release=' + os.environ['RELEASE_SHA'], headers={'Cache-Control': 'no-cache', 'User-Agent': 'PSTA-release-check'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          text = response.read().decode('utf-8')
                          if response.status != 200:
                              raise ValueError('HTTP ' + str(response.status))
                      missing = [value for value in required if value not in text]
                      if missing:
                          raise ValueError('Expected launch content not found: ' + ', '.join(missing))
                      if any(stale in text for stale in ('September 2026 cohort', 'November 2026 cohort', 'November 2026 to', 'May 2027', '10 November')):
                          raise ValueError('Superseded Academy recruitment dates remain')
                      print('PASS', url)
                      break
                  except Exception as exc:
                      if attempt == 5:
                          failures.append(url + ': ' + str(exc))
                      else:
                          time.sleep(10)
          if failures:
              raise SystemExit('\n'.join(failures))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'All {len(checks)} live PSTA offer, entry-point, Academy-date, webinar, news, feed, and sitemap checks passed.\n')
          PY
